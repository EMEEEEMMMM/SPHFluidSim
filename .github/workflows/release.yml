# Manual, on-demand release pipeline for SPHFluidSim.
#
# Jobs: prepare -> { windows, linux } -> release
#   prepare : validate VERSION, derive tag/asset names, refuse collisions
#   windows : MSYS2 UCRT64 (Qt6/assimp/opencl-icd) + CUDA redist, build + package
#   linux   : Ubuntu 24.04 + Qt 6.8 (aqt) + apt assimp/opencl + CUDA redist, build + package
#   release : checksum both archives, open a DRAFT GitHub Release
#
# GitHub-hosted runners have NO GPU. This pipeline only COMPILES the CUDA
# backend (it needs cuda.h / nvrtc.h; the driver/NVRTC libraries are loaded at
# runtime via NVRTC) and runs a `--version` smoke test. It deliberately does
# NOT run ctest and does NOT run CUDA parity tests or any CUDA kernel.
#
# CUDA comes from NVIDIA's per-component redistributable archives
# (developer.download.nvidia.com/compute/cuda/redist), not from the multi-GB
# toolkit installer: only two headers are needed to compile, and the NVRTC
# runtime is what gets bundled.
#
# Shells: `windows-latest` defaults to pwsh, so every cmake/build/smoke step
# explicitly uses `shell: msys2 {0}` (MSYS2 UCRT64 bash) while the packaging
# step switches back to pwsh for deploy/windows.ps1. All other jobs use bash.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release. Leave empty to read the root VERSION; if set, it must equal VERSION.'
        type: string
        required: false
        default: ''
      notes:
        description: 'Release notes. Leave empty for a placeholder you fill in on the web before publishing.'
        type: string
        required: false
        default: ''
      force:
        description: 'Replace an existing DRAFT release. A published release can never be overwritten.'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      win_asset: ${{ steps.meta.outputs.win_asset }}
      linux_asset: ${{ steps.meta.outputs.linux_asset }}
      body: ${{ steps.meta.outputs.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version, tag, asset names and collisions
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_NOTES: ${{ inputs.notes }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          # VERSION is the single source of truth: one line, no BOM, trailing \n.
          VERSION="$(tr -d '\r\n' < VERSION)"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION must be MAJOR.MINOR.PATCH, got '$VERSION'"
            exit 1
          fi

          # A dispatcher-supplied version must match VERSION exactly.
          if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "$VERSION" ]; then
            echo "::error::input version '$INPUT_VERSION' does not match VERSION '$VERSION'"
            exit 1
          fi

          # Tag and asset names carry the full MAJOR.MINOR.PATCH version, so
          # "v1.11.0" is exactly what users see in the release list, the tag
          # and the archive names.
          TAG="v${VERSION}"
          WIN_ASSET="SPHFluidSim-v${VERSION}-win64.zip"
          LINUX_ASSET="SPHFluidSim-v${VERSION}-linux-x86_64.tar.gz"
          echo "VERSION=$VERSION  TAG=$TAG"
          echo "  win  =$WIN_ASSET"
          echo "  linux=$LINUX_ASSET"

          # --- refuse to clobber an existing tag / release -------------------
          TAG_EXISTS=0
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            TAG_EXISTS=1
          fi
          RELEASE_EXISTS=0
          RELEASE_DRAFT=false
          if RELEASE_JSON="$(gh release view "$TAG" --json isDraft 2>/dev/null)"; then
            RELEASE_EXISTS=1
            RELEASE_DRAFT="$(printf '%s' "$RELEASE_JSON" | jq -r '.isDraft')"
          fi

          if [ "$TAG_EXISTS" -eq 1 ] || [ "$RELEASE_EXISTS" -eq 1 ]; then
            if [ "$INPUT_FORCE" != "true" ]; then
              echo "::error::tag/release '$TAG' already exists; re-run with force=true to replace a DRAFT."
              exit 1
            fi
            # force may only replace a draft; a published release is final.
            if [ "$RELEASE_EXISTS" -eq 1 ] && [ "$RELEASE_DRAFT" != "true" ]; then
              echo "::error::release '$TAG' is already published; force cannot overwrite a published release."
              exit 1
            fi
            echo "::warning::force=true: the existing draft '$TAG' will be replaced."
          fi

          # --- release body --------------------------------------------------
          if [ -n "$INPUT_NOTES" ]; then
            BODY="$INPUT_NOTES"
          else
            BODY="_Draft release for v${VERSION}. Please fill in the release notes in the GitHub web UI, then publish._"
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "win_asset=$WIN_ASSET"
            echo "linux_asset=$LINUX_ASSET"
            echo 'body<<__SPH_BODY_EOF__'
            printf '%s\n' "$BODY"
            echo '__SPH_BODY_EOF__'
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  windows:
    name: Build + package (Windows x86_64 / UCRT64)
    needs: prepare
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      WIN_ASSET: ${{ needs.prepare.outputs.win_asset }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (UCRT64)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: minimal
          # qt6-base provides windeployqt; qt6-declarative provides Qt Quick /
          # QuickControls2 / QML. The OpenCL ICD loader is installed in its own
          # step below because it is optional and its package name has changed
          # before (ocl-icd -> opencl-icd).
          # libgomp is an *optional* dependency of the GCC package: without it
          # -fopenmp compiles but cannot link (libgomp.dll.a is missing), so it
          # must be requested explicitly.
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libgomp
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-assimp

      # Optional: the app falls back to the CPU backend when no ICD loader is
      # present, and deploy/windows.ps1 already tolerates a missing OpenCL.dll.
      # Keeping it out of the `install:` list means a rename upstream can never
      # abort the whole release again.
      - name: Install OpenCL ICD loader (optional)
        shell: msys2 {0}
        run: |
          pacman -S --noconfirm --needed --overwrite '*' mingw-w64-ucrt-x86_64-opencl-icd \
            || echo "::warning::mingw-w64-ucrt-x86_64-opencl-icd unavailable; the archive will ship without OpenCL.dll"

      # The backend only needs the *headers* at build time (the driver and NVRTC
      # are opened with LoadLibrary at runtime), and the archive needs the NVRTC
      # DLLs. Installing the 4 GB toolkit for that is slow and its silent
      # installer can hang on a hosted runner, so pull NVIDIA's two small
      # redistributable archives instead (~190 MB, plain HTTPS).
      #
      # The archives are .zip, and plain `tar.exe` on a runner may resolve to
      # Git for Windows' GNU tar, which cannot read zip. Expand-Archive is a
      # PowerShell cmdlet, so PATH cannot shadow it.
      - name: Install CUDA headers + NVRTC (redistributable archives)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\cuda'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $base = 'https://developer.download.nvidia.com/compute/cuda/redist'
          $tmp  = Join-Path $env:RUNNER_TEMP 'cuda-redist'

          curl.exe -fsSL --retry 3 -o "${tmp}-cudart.zip" `
            "$base/cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-12.6.77-archive.zip"
          curl.exe -fsSL --retry 3 -o "${tmp}-nvrtc.zip" `
            "$base/cuda_nvrtc/windows-x86_64/cuda_nvrtc-windows-x86_64-12.6.85-archive.zip"
          if ($LASTEXITCODE -ne 0) { throw "CUDA archive download failed ($LASTEXITCODE)" }

          foreach ($name in 'cudart', 'nvrtc') {
            $zipPath = "${tmp}-${name}.zip"
            $stage   = Join-Path $env:RUNNER_TEMP "cuda-stage-${name}"
            if (Test-Path $stage) { Remove-Item -LiteralPath $stage -Recurse -Force }
            Expand-Archive -Path $zipPath -DestinationPath $stage -Force
            $inner = Get-ChildItem -LiteralPath $stage -Directory | Select-Object -First 1
            if (-not $inner) { throw "Unexpected layout in $zipPath" }
            Copy-Item -Path (Join-Path $inner.FullName '*') -Destination $root -Recurse -Force
            Remove-Item -LiteralPath $stage -Recurse -Force
          }

          foreach ($f in 'include\cuda.h', 'include\nvrtc.h', 'bin\nvrtc64_120_0.dll') {
            if (-not (Test-Path (Join-Path $root $f))) { throw "CUDA archive is missing $f" }
          }

          "CUDA_PATH=C:/cuda" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "CUDA_HOME=C:/cuda" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      # windows-latest defaults to pwsh; cmake/build MUST run inside the MSYS2
      # UCRT64 shell so gcc, ninja, Qt6 and assimp resolve correctly.
      - name: Configure (MSYS2 bash) and enforce the CUDA gate
        shell: msys2 {0}
        run: |
          set -euo pipefail

          # Keep native Windows CUDA paths intact when MSYS2 launches cmake.exe.
          export MSYS2_ENV_CONV_EXCL='CUDA_PATH;CUDA_HOME'
          CUDA_ROOT="${CUDA_PATH:-/c/cuda}"
          [ -n "$CUDA_ROOT" ] || CUDA_ROOT=/c/cuda
          CUDA_ROOT="${CUDA_ROOT//\\//}"          # backslashes -> forward slashes
          export CUDA_PATH="$CUDA_ROOT"
          export CUDA_HOME="$CUDA_ROOT"
          CUDA_CHECK="$(cygpath -u "$CUDA_ROOT" 2>/dev/null || printf '%s' "$CUDA_ROOT")"

          test -f "$CUDA_CHECK/include/cuda.h"  || { echo "::error::cuda.h not found in $CUDA_ROOT/include"; exit 1; }
          test -f "$CUDA_CHECK/include/nvrtc.h" || { echo "::error::nvrtc.h not found in $CUDA_ROOT/include"; exit 1; }

          # Derive the Qt prefix from windeployqt instead of hard-coding C:/msys64.
          QT_BIN="$(cd "$(dirname "$(command -v windeployqt)")" && pwd)"
          QT_PREFIX="$(cygpath -m "$(dirname "$QT_BIN")")"

          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DSPH_ENABLE_CUDA=ON \
                -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
                2>&1 | tee configure.log

          # Quality gate: never silently ship a CPU-only package.
          # (Hosted runners have no GPU, so we only verify the backend compiled,
          #  NOT that it runs - no ctest / CUDA parity here.)
          if ! grep -q "CUDA backend: enabled" configure.log; then
            echo "::error::'CUDA backend: enabled' missing from configure output - refusing to package."
            exit 1
          fi

      - name: Build (MSYS2 bash)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake --build build --parallel

      - name: 'Smoke test: SPHFluidSim.exe --version'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ./build/SPHFluidSim.exe --version | tee version.txt
          grep -q "SPHFluidSim v" version.txt || {
            echo "::error::--version did not print the version banner"
            exit 1
          }

      - name: Package with deploy/windows.ps1 (pwsh)
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $ErrorActionPreference = 'Stop'
          $msysRoot = $env:MSYS2_LOCATION
          if (-not $msysRoot -or -not (Test-Path -LiteralPath $msysRoot)) { $msysRoot = 'C:\msys64' }
          $qtBin = Join-Path $msysRoot 'ucrt64\bin'
          $cudaRoot = $env:CUDA_PATH
          if (-not $cudaRoot) { $cudaRoot = 'C:\cuda' }
          ./deploy/windows.ps1 `
            -BuildDir 'build' `
            -Output  "dist/$env:WIN_ASSET" `
            -Version $env:VERSION `
            -QtBin   $qtBin `
            -Msys2Bin $qtBin `
            -CudaBin (Join-Path $cudaRoot 'bin')

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/${{ needs.prepare.outputs.win_asset }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  linux:
    name: Build + package (Linux x86_64)
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      LINUX_ASSET: ${{ needs.prepare.outputs.linux_asset }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libassimp-dev ocl-icd-opencl-dev opencl-headers \
            libgl-dev libglu1-mesa-dev libegl-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-xfixes0 libxcb-sync1 \
            libdbus-1-3 libfontconfig1 libglib2.0-0

      # aqtinstall via install-qt-action exports CMAKE_PREFIX_PATH / Qt6_DIR /
      # QT_ROOT_DIR into the environment for the later cmake + packaging steps.
      #
      # Do NOT list `qtdeclarative` here: for Qt 6 it is a base archive that aqt
      # installs as part of the desktop target, and asking for it as a module
      # makes aqt abort with "packages ['qtdeclarative'] were not found".
      # `qtshadertools` really is an add-on module (Qt Quick Effects needs it).
      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: desktop
          modules: qtshadertools
          cache: true

      # Fail here, with a clear message, if the desktop base ever stops shipping
      # Qt Quick; otherwise the error only shows up much later inside CMake.
      - name: Verify Qt Quick is present
        run: |
          set -euo pipefail
          test -d "$QT_ROOT_DIR/lib/cmake/Qt6Quick" || {
            echo "::error::Qt6Quick not found in $QT_ROOT_DIR - the Qt desktop base package did not include qtdeclarative"
            exit 1
          }

      # Same idea as the Windows job: only cuda.h / nvrtc.h are needed to
      # compile, and libnvrtc.so* is bundled by deploy/linux.sh. NVIDIA's
      # redistributable archives are ~35 MB in total and never need a silent
      # multi-gigabyte installer (or a toolkit version that the action may not
      # know about).
      - name: Install CUDA headers + NVRTC (redistributable archives)
        run: |
          set -euo pipefail
          base=https://developer.download.nvidia.com/compute/cuda/redist
          curl -fL --retry 3 -o /tmp/cudart.tar.xz \
            "$base/cuda_cudart/linux-x86_64/cuda_cudart-linux-x86_64-12.6.77-archive.tar.xz"
          curl -fL --retry 3 -o /tmp/nvrtc.tar.xz \
            "$base/cuda_nvrtc/linux-x86_64/cuda_nvrtc-linux-x86_64-12.6.85-archive.tar.xz"

          sudo mkdir -p /usr/local/cuda
          sudo tar -xJf /tmp/cudart.tar.xz -C /usr/local/cuda --strip-components=1
          sudo tar -xJf /tmp/nvrtc.tar.xz  -C /usr/local/cuda --strip-components=1

          test -f /usr/local/cuda/include/cuda.h  || { echo "::error::cuda.h missing"; exit 1; }
          test -f /usr/local/cuda/include/nvrtc.h || { echo "::error::nvrtc.h missing"; exit 1; }
          ls -l /usr/local/cuda/lib/libnvrtc.so*

      - name: Configure and enforce the CUDA gate
        shell: bash
        run: |
          set -euo pipefail
          test -f /usr/local/cuda/include/cuda.h  || { echo "::error::cuda.h missing"; exit 1; }
          test -f /usr/local/cuda/include/nvrtc.h || { echo "::error::nvrtc.h missing"; exit 1; }
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DSPH_ENABLE_CUDA=ON \
                2>&1 | tee configure.log
          # Quality gate: hosted runners have no GPU, so we only verify the
          # backend compiled; no ctest / CUDA parity is run in this pipeline.
          if ! grep -q "CUDA backend: enabled" configure.log; then
            echo "::error::'CUDA backend: enabled' missing from configure output - refusing to package."
            exit 1
          fi

      - name: Build
        run: cmake --build build --parallel

      - name: 'Smoke test: SPHFluidSim --version'
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="${QT_ROOT_DIR:+$QT_ROOT_DIR/lib:}${LD_LIBRARY_PATH:-}"
          ./build/SPHFluidSim --version | tee version.txt
          grep -q "SPHFluidSim v" version.txt || {
            echo "::error::--version did not print the version banner"
            exit 1
          }

      - name: Fetch linuxdeploy and its Qt plugin
        run: |
          set -euo pipefail
          mkdir -p tools
          base=https://github.com/linuxdeploy
          curl -fL --retry 3 -o tools/linuxdeploy \
            "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -fL --retry 3 -o tools/linuxdeploy-plugin-qt \
            "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x tools/linuxdeploy tools/linuxdeploy-plugin-qt
          # linuxdeploy discovers its Qt plugin as a sibling on PATH.
          echo "$PWD/tools" >> "$GITHUB_PATH"
          "$PWD/tools/linuxdeploy" --version
          "$PWD/tools/linuxdeploy-plugin-qt" --version || true

      - name: Package with deploy/linux.sh
        run: |
          set -euo pipefail
          chmod +x deploy/linux.sh
          export PATH="$PWD/tools:$PATH"
          export APPIMAGE_EXTRACT_AND_RUN=1
          bash deploy/linux.sh \
            --build-dir build \
            --output "dist/$LINUX_ASSET" \
            --version "$VERSION" \
            --qt-root "${QT_ROOT_DIR:-}" \
            --cuda-root /usr/local/cuda \
            --linuxdeploy "$PWD/tools/linuxdeploy"

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: dist/${{ needs.prepare.outputs.linux_asset }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  release:
    name: Assemble draft GitHub Release
    needs: [prepare, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download both packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        env:
          WIN_ASSET: ${{ needs.prepare.outputs.win_asset }}
          LINUX_ASSET: ${{ needs.prepare.outputs.linux_asset }}
        run: |
          set -euo pipefail
          cd artifacts
          ls -l
          sha256sum "$WIN_ASSET" "$LINUX_ASSET" > SHA256SUMS
          cat SHA256SUMS

      - name: Create (or refresh) the DRAFT release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          WIN_ASSET: ${{ needs.prepare.outputs.win_asset }}
          LINUX_ASSET: ${{ needs.prepare.outputs.linux_asset }}
          BODY: ${{ needs.prepare.outputs.body }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ "$FORCE" = "true" ]; then
            # prepare already verified that only a DRAFT may be replaced.
            # Remove the draft and its tag so the new release/tag points at the
            # workflow's current commit; a missing/stale tag is harmless.
            gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
            git push origin ":refs/tags/$TAG" 2>/dev/null || true
          fi
          # Always create a DRAFT; the maintainer fills in notes/asset checks
          # in the GitHub web UI and then presses "Publish release".
          gh release create "$TAG" \
            --draft \
            --title "SPHFluidSim v$VERSION" \
            --notes "$BODY" \
            "artifacts/$WIN_ASSET" \
            "artifacts/$LINUX_ASSET" \
            artifacts/SHA256SUMS \
            README.md
